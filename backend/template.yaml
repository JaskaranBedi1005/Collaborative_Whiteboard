AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Serverless real-time collaborative whiteboard - WebSocket backend

# Cost notes (keep this project at $0):
# - DynamoDB uses PROVISIONED capacity. AWS gives 25 read + 25 write units free
#   forever per region, counting tables AND indexes. Budget so far:
#     ConnectionsTable 5/5 + byBoard index 5/5 = 10/10
#     BoardState 10/10 = 20/20 total
# - Lambda: 1M requests/month always free.
# - Logs are kept 7 days only.
# - S3: 5 GB standard storage free for 12 months (frontend build is <1 MB).
# - CloudFront: 1 TB data transfer out/month and 10M requests/month always free.

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 30
    CodeUri: src/
    Environment:
      Variables:
        CONNECTIONS_TABLE: !Ref ConnectionsTable

Resources:
  # ---------------------------------------------------------------- Database
  ConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5
      AttributeDefinitions:
        - AttributeName: connectionId
          AttributeType: S
        - AttributeName: boardId
          AttributeType: S
      KeySchema:
        - AttributeName: connectionId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: byBoard
          KeySchema:
            - AttributeName: boardId
              KeyType: HASH
          Projection:
            ProjectionType: KEYS_ONLY
          ProvisionedThroughput:
            ReadCapacityUnits: 5
            WriteCapacityUnits: 5
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # Store one item per stroke; use a timestamp-first strokeId for drawing order.
  BoardState:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 10
        WriteCapacityUnits: 10
      AttributeDefinitions:
        - AttributeName: boardId
          AttributeType: S
        - AttributeName: strokeId
          AttributeType: S
      KeySchema:
        - AttributeName: boardId
          KeyType: HASH
        - AttributeName: strokeId
          KeyType: RANGE

  # ---------------------------------------------------------------- Lambdas
  ConnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: connect.handler
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref ConnectionsTable

  DisconnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: disconnect.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ConnectionsTable

  DrawFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: draw.handler
      Environment:
        Variables:
          BOARD_STATE_TABLE: !Ref BoardState
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ConnectionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref BoardState
        - Statement:
            - Effect: Allow
              Action: execute-api:ManageConnections
              Resource: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*

  ConnectLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ConnectFunction}
      RetentionInDays: 7

  DisconnectLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${DisconnectFunction}
      RetentionInDays: 7

  DrawLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${DrawFunction}
      RetentionInDays: 7

  SummarizeFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: summarize.handler
      Timeout: 30
      Environment:
        Variables:
          GEMINI_KEY_PARAM: /whiteboard/gemini-api-key
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
                - ssm:GetParameters
              Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/whiteboard/gemini-api-key
      Events:
        SummarizePost:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /summarize
            Method: post
        SummarizeOptions:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /summarize
            Method: options

  SummarizeLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${SummarizeFunction}
      RetentionInDays: 7

  # ---------------------------------------------------------------- REST API for AI Summary
  RestApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowMethods: "'POST,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key'"
        AllowOrigin: "'*'"

  # ---------------------------------------------------------------- WebSocket API
  WebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: whiteboard-websocket
      ProtocolType: WEBSOCKET
      # Messages are routed by their "action" field, e.g. {"action":"draw", ...}
      RouteSelectionExpression: $request.body.action

  # $connect
  ConnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ConnectFunction.Arn}/invocations

  ConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $connect
      AuthorizationType: NONE
      Target: !Sub integrations/${ConnectIntegration}

  ConnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ConnectFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*

  # $disconnect
  DisconnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DisconnectFunction.Arn}/invocations

  DisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $disconnect
      AuthorizationType: NONE
      Target: !Sub integrations/${DisconnectIntegration}

  DisconnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref DisconnectFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*

  # draw
  DrawIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DrawFunction.Arn}/invocations

  DrawRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: draw
      AuthorizationType: NONE
      Target: !Sub integrations/${DrawIntegration}

  DrawPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref DrawFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*

  # The live "prod" version. AutoDeploy publishes route changes automatically.
  Stage:
    Type: AWS::ApiGatewayV2::Stage
    DependsOn: [ConnectRoute, DisconnectRoute, DrawRoute]
    Properties:
      ApiId: !Ref WebSocketApi
      StageName: prod
      AutoDeploy: true
      DefaultRouteSettings:
        # Safety limit so nobody can spam the API and run up a bill.
        ThrottlingBurstLimit: 100
        ThrottlingRateLimit: 50

  # ---------------------------------------------------------------- Frontend Hosting (S3 + CloudFront with OAC)
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      # Private bucket - CloudFront accesses it via OAC (no public website hosting)
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # Origin Access Control - lets CloudFront fetch from the private S3 bucket
  FrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # CloudFront distribution - HTTPS, global CDN, SPA routing
  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref FrontendOAC
            S3OriginConfig: {}   # Required placeholder when using OAC
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # CachingOptimized (AWS managed)
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
        # SPA fallback: return index.html for any 403/404 so React Router handles the path
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
        PriceClass: PriceClass_100   # US + Europe + Asia edges (cheapest; free tier covers this)

  # Allow CloudFront OAC to read objects from the private bucket
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipal
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub arn:${AWS::Partition}:s3:::${FrontendBucket}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}

Outputs:
  WebSocketUrl:
    Description: Put this in frontend/.env.local as VITE_WS_URL
    Value: !Sub wss://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/prod
  FrontendBucketName:
    Description: "S3 bucket name - upload with: aws s3 sync dist s3://<FrontendBucketName> --delete"
    Value: !Ref FrontendBucket
  CloudFrontUrl:
    Description: Public HTTPS URL for the whiteboard (via CloudFront CDN)
    Value: !Sub https://${FrontendDistribution.DomainName}
  CloudFrontDistributionId:
    Description: Use for cache invalidation after deployments
    Value: !Ref FrontendDistribution
  SummarizeApiUrl:
    Description: Put this in frontend/.env.local as VITE_SUMMARIZE_URL
    Value: !Sub https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/prod/summarize
